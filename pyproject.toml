[project]
name = "cnc"
version = "0.1.0"
description = "One VPS hosts many mini-projects control plane."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14.1",
  "aiosqlite>=0.20.0",
  "argon2-cffi>=25.1.0",
  "fastapi>=0.116.0",
  "greenlet>=3.1.1",
  "jinja2>=3.1.4",
  "pydantic-settings==2.14.2",
  "sqlalchemy>=2.0.36",
  "uvicorn>=0.32.1",
  "python-multipart==0.0.31",
  "starlette==1.3.1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.3.4",
  "pytest-asyncio>=0.24.0",
]

[project.scripts]
cnc-admin = "app.admin_cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
  "ignore:'asyncio\\.iscoroutinefunction' is deprecated.*:DeprecationWarning:pytest_asyncio\\.plugin",
  "ignore:'asyncio\\.get_event_loop_policy' is deprecated.*:DeprecationWarning:pytest_asyncio\\.plugin",
  "ignore:'asyncio\\.set_event_loop_policy' is deprecated.*:DeprecationWarning:pytest_asyncio\\.plugin",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "migrations*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/css/*.css", "static/js/*.js", "static/vendor/*.js"]
