[project]
name = "cnc"
version = "0.1.2"
description = "One VPS hosts many mini-projects control plane."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "alembic==1.18.4",
  "aiosqlite==0.22.1",
  "argon2-cffi==25.1.0",
  "fastapi==0.136.1",
  "greenlet==3.5.0",
  "jinja2==3.1.6",
  "pydantic-settings==2.14.2",
  "sqlalchemy==2.0.49",
  "uvicorn==0.47.0",
  "python-multipart==0.0.31",
  "starlette==1.3.1",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
]

[project.scripts]
cnc-admin = "app.admin_cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
  "ignore:'asyncio\\.iscoroutinefunction' is deprecated.*:DeprecationWarning:pytest_asyncio\\.plugin",
  "ignore:'asyncio\\.get_event_loop_policy' is deprecated.*:DeprecationWarning:pytest_asyncio\\.plugin",
  "ignore:'asyncio\\.set_event_loop_policy' is deprecated.*:DeprecationWarning:pytest_asyncio\\.plugin",
]

[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "migrations*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/css/*.css", "static/js/*.js", "static/vendor/*.js"]
